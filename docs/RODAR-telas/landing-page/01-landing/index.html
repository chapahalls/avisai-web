nt = this.target;\n    this.anim = null;\n    this.loopId = null;\n    this.tick = this.tick.bind(this);\n    const maxScroll = () => { const se = document.scrollingElement || document.documentElement; return se.scrollHeight - window.innerHeight; };\n    this.maxScroll = maxScroll;\n    this.onWheel = (e) => {\n      if (e.ctrlKey) return;\n      const max = maxScroll();\n      if (max <= 1) return;\n      if (this.locked) { e.preventDefault(); return; }\n      let el = e.target;\n      while (el && el !== document.body) { if (el.hasAttribute && el.hasAttribute('data-lenis-prevent')) return; el = el.parentNode; }\n      e.preventDefault();\n      let d = e.deltaY;\n      if (e.deltaMode === 1) d *= 16; else if (e.deltaMode === 2) d *= window.innerHeight;\n      this.anim = null;\n      this.target = Math.max(0, Math.min(max, this.target + d));\n      this.kick();\n    };\n    this.onNativeScroll = () => { if (this.loopId) return; this.target = this.current = window.scrollY || 0; };\n    this.onAnchor = (e) => {\n      const a = e.target && e.target.closest ? e.target.closest('a[href^=\"#\"]') : null;\n      if (!a) return;\n      const id = a.getAttribute('href').slice(1);\n      const el = id ? document.getElementById(id) : null;\n      if (!el || maxScroll() <= 1) return;\n      e.preventDefault();\n      this.scrollTo(el.getBoundingClientRect().top + (window.scrollY || 0), 1.2);\n    };\n    window.addEventListener('wheel', this.onWheel, { passive: false });\n    window.addEventListener('scroll', this.onNativeScroll);\n    document.addEventListener('click', this.onAnchor);\n  }\n  scrollTo(y, duration) {\n    const to = Math.max(0, Math.min(this.maxScroll(), y));\n    this.anim = { from: this.current, to, t0: performance.now(), d: (duration || 1.2) * 1000 };\n    this.target = to;\n    this.kick();\n  }\n  kick() { if (this.loopId) return; this.last = performance.now(); this.loopId = requestAnimationFrame(this.tick); }\n  tick(now) {\n    const dt = Math.min(0.05  ease(seg(p, 0.58, 0.72));\n    const netDraw = seg(p, 0.68, 0.8);\n    const toGlobe = ease(seg(p, 0.84, 0.94));\n    const globeIn = seg(p, 0.86, 0.95);\n    const typeLine = (text, a, b, fadeAt, fadeEnd) => {\n      const k = seg(p, a, b);\n      const n = Math.round(k * text.length);\n      const vis = p >= a - 0.004 ? (fadeAt ? 1 - seg(p, fadeAt, fadeEnd) : 1) : 0;\n      return { done: text.slice(0, Math.max(0, n - 1)), cur: n > 0 ? text.slice(n - 1, n) : '', rest: text.slice(n), op: String(vis) };\n    };\n    const typed = [\n      typeLine('Tudo começa num chip de inteligência.', 0.015, 0.09, 0.14, 0.17),\n      typeLine('Que cabe no celular do motorista…', 0.18, 0.27, 0.33, 0.36),\n      typeLine('…e transforma cada caminhão em dado vivo.', 0.42, 0.53, 0.58, 0.61),\n      typeLine('Cada rota do Brasil, ao vivo, num só mapa.', 0.68, 0.8, 0.84, 0.87),\n      typeLine('Do motorista ao CCO. Do Brasil para o mundo.', 0.9, 0.98, 0, 0)\n    ];\n    const brS = lerp(1, 0.4032, toGlobe);\n    const stat = p >= 0.86 ? ['ESCALA', 'Global', 'mesma plataforma para qualquer malha rodoviária'] : ['MALHA RODOVIÁRIA', '45 polos', 'cidades conectadas em tempo real pelo CCO RODAR'];\n    const heroV = {\n      cam, typed,\n      gridEarlyOp: (0.9 * (1 - seg(p, 0.12, 0.22))).toFixed(3),\n      tracesOp: (1 - seg(p, 0.08, 0.15)).toFixed(3),\n      traceOff: String(100 - seg(p, 0, 0.07) * 100),\n      chipX: (-chipW / 2).toFixed(2), chipY: (chipCY - chipW / 2).toFixed(2), chipW: chipW.toFixed(2),\n      chipSat: (1 - decolor).toFixed(3), chipBright: (1 - 0.25 * decolor).toFixed(3),\n      chipOp: (1 - seg(p, 0.3, 0.37)).toFixed(3),\n      phoneOp: (seg(p, 0.12, 0.19) * (1 - seg(p, 0.3, 0.37))).toFixed(3), screenOp: seg(p, 0.17, 0.23).toFixed(3),\n      skyOp: (sceneIn * (1 - night)).toFixed(3), groundOp: (sceneIn * (1 - night) * (1 - truckOut)).toFixed(3),\n      yardOp: (seg(p, 0.3, 0.4) * (1 - wire)).toFixed(3),\n      shadowOp: (0.5 * sceneIn * (1 - night)).toFixed(3), beamO

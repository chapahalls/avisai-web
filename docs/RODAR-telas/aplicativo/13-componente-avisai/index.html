<script>DCLite.mount({"defs": {"AvisAI-Bubble": {"template": "<div style=\"position: relative; width: 390px; height: 844px; pointer-events: none; font-family: Inter, system-ui, sans-serif; color: #f3f6f4\">\n\n<sc-if value=\"{{showTip}}\" hint-placeholder-val=\"{{ true }}\">\n<div aria-live=\"polite\" style=\"position: absolute; left: {{tipLeft}}; top: {{tipTop}}; width: 230px; padding: 10px 12px; border-radius: 14px; background: #111512; border: 1px solid #2f6b45; box-shadow: 0 8px 24px rgba(0,0,0,0.45); font-size: 13px; line-height: 1.4; pointer-events: auto\">\n<span style=\"display: block; font-size: 11px; font-weight: 700; color: #9fe0b8; margin-bottom: 2px\">AvisAI · ouvindo<\/span>{{tip}}<\/div>\n<\/sc-if>\n\n<button onPointerDown=\"{{down}}\" onPointerMove=\"{{move}}\" onPointerUp=\"{{up}}\" onPointerCancel=\"{{up}}\" aria-label=\"AvisAI, toque para ver comandos ou arraste para mover\" aria-expanded=\"{{openStr}}\" class=\"avisai-orb\" style=\"position: absolute; left: {{x}}; top: {{y}}; width: 64px; height: 64px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18); background: #1f5a37; overflow: hidden; pointer-events: auto; touch-action: none; cursor: grab; box-shadow: 0 10px 26px rgba(0,0,0,0.55), 0 0 0 {{halo}} rgba(127,209,156,0.16); transition: {{trans}}\">\n<span style=\"position: absolute; inset: 0; animation: avisai-breathe 3s ease-in-out infinite\">\n<span style=\"position: absolute; left: 0; top: 0; width: 170%; height: 170%; background: linear-gradient(162deg, #174a2c 0%, #2f8a55 34%, #d9f3e2 47%, #9fe0b8 55%, #3f9a63 72%, #123d25 100%); filter: blur(6px); animation: avisai-drift 9s ease-in-out infinite\"><\/span>\n<span style=\"position: absolute; inset: 0; background: radial-gradient(circle at 30% 26%, rgba(255,255,255,0.22), rgba(255,255,255,0) 50%)\"><\/span>\n<\/span>\n<sc-if value=\"{{muted}}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"position: absolute; right: 2px; bottom: 2px; width: 22px; height: 22px; border-radius: 50%; background: #f3f6f4; color: #000; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M3 3l18 18\"><\/path><path d=\"M9 9v2.5a3 3 0 0 0 5 2.2M15 10V5.5a3 3 0 0 0-5.7-1.3\"><\/path><\/svg><\/span>\n<\/sc-if>\n<\/button>\n\n<sc-if value=\"{{open}}\" hint-placeholder-val=\"{{ false }}\">\n<section role=\"dialog\" aria-label=\"AvisAI\" style=\"position: absolute; left: 10px; right: 10px; bottom: 92px; padding: 16px; border-radius: 24px; background: #0f1311; border: 1px solid #24372b; box-shadow: 0 16px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 12px; pointer-events: auto\">\n<div style=\"display: flex; align-items: center; gap: 12px\">\n<span style=\"width: 40px; height: 40px; border-radius: 50%; overflow: hidden; position: relative; background: #1f5a37; flex: none\"><span style=\"position: absolute; left: 0; top: 0; width: 170%; height: 170%; background: linear-gradient(162deg, #174a2c 0%, #2f8a55 34%, #d9f3e2 47%, #9fe0b8 55%, #3f9a63 72%, #123d25 100%); filter: blur(5px); animation: avisai-drift 9s ease-in-out infinite\"><\/span><\/span>\n<div style=\"display: flex; flex-direction: column; flex: 1\"><span style=\"font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700\">{{panelTitle}}<\/span><span style=\"font-size: 12px; color: #9aa69e\">Fale de qualquer tela. Eu troco a tela para você.<\/span><\/div>\n<button onClick=\"{{toggleMute}}\" aria-pressed=\"{{mutedStr}}\" aria-label=\"{{muteLabel}}\" style=\"width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; {{muteStyle}}\"><svg aria-hidden=\"true\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"12\" rx=\"3\"><\/rect><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3.5\"><\/path><\/svg><\/button>\n<button onClick=\"{{close}}\" aria-label=\"Fechar\" style=\"width: 44px; height: 44px; border-radius: 50%; border: none; background: #1e1f1e; color: #f3f6f4; display: flex; align-items: center; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n<\/div>\n<span style=\"font-size: 12px; color: #8a968e\">Toque para simular o que você diria:<\/span>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<sc-for list=\"{{commands}}\" as=\"c\" hint-placeholder-count=\"5\">\n<a href=\"{{c.href}}\" style=\"display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #161c18; border: 1px solid #1f2722; color: #f3f6f4; text-decoration: none\">\n<span style=\"font-size: 15px; font-weight: 600\">“{{c.say}}”<\/span>\n<span style=\"font-size: 12px; color: #9fe0b8\">→ {{c.does}}<\/span>\n<\/a>\n<\/sc-for>\n<\/div>\n<a href=\"Mobile-ChatLive.dc.html\" style=\"align-self: center; font-size: 13px; font-weight: 600; color: #7fd19c; text-decoration: none; padding: 6px 10px\">Abrir conversa em tela cheia<\/a>\n<\/section>\n<\/sc-if>\n<\/div>", "code": "\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { x: 310, y: 600, dragging: false, open: false, muted: false, tip: true };\n    this.drag = null;\n  }\n  componentDidMount() { this.tipTimer = setTimeout(() => this.setState({ tip: false }), 7000); }\n  componentWillUnmount() { clearTimeout(this.tipTimer); }\n  renderVals() {\n    const s = this.state;\n    const screen = this.props.screen ?? 'home';\n    const tips = {\n      home: 'Estou ouvindo. Diga “Iniciar viagem, AvisAI!” quando estiver pronto.',\n      map: 'Pergunte “quanto falta?” ou “onde fica a portaria?”.',\n      docs: 'Peça um documento: “mostra o CT-e”.',\n      msgs: 'Dite: “manda pro CCO que…”.',\n      fila: '“Me avisa quando chamarem.”'\n    };\n    const all = [\n      ['Iniciar viagem, AvisAI!', 'inicia a viagem 4471 com você', 'Mobile-AgenteInicia.dc.html', 'home'],\n      ['Mostra a nota fiscal do Atacado', 'vai para Documentos e abre a NF-e 184.221', 'Mobile-DocGuiado.dc.html', 'docs'],\n      ['Meus documentos', 'abre a aba Documentos', 'Mobile-Documentos.dc.html', 'docs'],\n      ['Onde eu tô? Quanto falta?', 'abre o Mapa com a rota', 'Mobile-Mapa.dc.html', 'map'],\n      ['Quantos caminhões na fila?', 'abre a Fila no recebedor', 'Mobile-Fila.dc.html', 'fila'],\n      ['Manda pro CCO que vou atrasar', 'envia e mostra em Mensagens', 'Mobile-Mensagens.dc.html', 'msgs'],\n      ['Liga pro CCO', 'abre a chamada com a Ana', 'Mobile-ChamadaCCO.dc.html', 'any']\n    ];\n    const ordered = all.filter((c) => c[3] === screen).concat(all.filter((c) => c[3] !== screen)).slice(0, 5);\n    const commands = ordered.map(([say, does, href]) => ({ say, does, href }));\n    const W = 390, H = 844, B = 64;\n    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));\n    const down = (e) => {\n      if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);\n      this.drag = { sx: e.clientX, sy: e.clientY, ox: this.state.x, oy: this.state.y, moved: false };\n      this.setState({ dragging: true });\n    };\n    const move = (e) => {\n      const d = this.drag; if (!d) return;\n      const dx = e.clientX - d.sx, dy = e.clientY - d.sy;\n      if (Math.abs(dx) + Math.abs(dy) > 5) d.moved = true;\n      if (!d.moved) return;\n      this.setState({ x: clamp(d.ox + dx, 8, W - B - 8), y: clamp(d.oy + dy, 40, H - B - 96), tip: false });\n    };\n    const up = () => {\n      const d = this.drag; this.drag = null;\n      if (!d) return;\n      if (!d.moved) { this.setState({ dragging: false, open: !this.state.open, tip: false }); return; }\n      const snapX = this.state.x + B / 2 < W / 2 ? 10 : W - B - 10;\n      this.setState({ dragging: false, x: snapX });\n    };\n    const leftSide = s.x + B / 2 < W / 2;\n    return {\n      x: s.x + 'px', y: s.y + 'px',\n      trans: s.dragging ? 'none' : 'left 0.28s cubic-bezier(.2,.8,.2,1), top 0.28s cubic-bezier(.2,.8,.2,1)',\n      halo: s.open ? '12px' : '6px',\n      down, move, up,\n      showTip: s.tip && !s.open,\n      tip: tips[screen],\n      tipLeft: (leftSide ? s.x + B + 10 : s.x - 240) + 'px',\n      tipTop: (s.y + 4) + 'px',\n      open: s.open, openStr: s.open ? 'true' : 'false',\n      close: () => this.setState({ open: false }),\n      panelTitle: s.muted ? 'Microfone mudo' : 'AvisAI está ouvindo',\n      muted: s.muted, mutedStr: s.muted ? 'true' : 'false',\n      muteLabel: s.muted ? 'Ligar microfone' : 'Mutar microfone',\n      muteStyle: s.muted ? 'background:#f3f6f4;color:#000' : 'background:#1e1f1e;color:#f3f6f4',\n      toggleMute: () => this.setState({ muted: !s.muted }),\n      commands\n    };\n  }\n}\n"}}, "entry": "AvisAI-Bubble", "links": {"Mobile-ChatLive.dc.html": "../06-chat-ao-vivo/index.html", "Mobile-Mapa.dc.html": "../08-mapa/index.html", "Mobile-Fila.dc.html": "../12-fila-recebedor/index.html", "Mobile-ChamadaCCO.dc.html": "../07-chamada-cco/index.html", "Mobile-Mensagens.dc.html": "../11-mensagens-cco/index.html", "Mobile-DocGuiado.dc.html": "../10-documento-guiado/index.html", "Mobile-AgenteInicia.dc.html": "../04-agente-inicia-viagem/index.html", "Mobile-Documentos.dc.html": "../09-documentos/index.html"}}, document.getElementById('dc-root'));</script>

name: Demo (GitHub Pages)

# Publica o site e o painel do CCO no modo Demo em https://rodarglobal.github.io/rodar-web/
# a cada push na main. Precisa, uma vez: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build no subcaminho do Pages (sem VITE_API_BASE_URL = modo Demo)
        run: npx tsc -b && npx vite build --base /rodar-web/
      - name: Fallback das rotas do React Router (links diretos como /rodar-web/dashboard)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
